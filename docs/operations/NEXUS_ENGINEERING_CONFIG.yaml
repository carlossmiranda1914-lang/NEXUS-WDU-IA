scope:
  authorized:
    - documentation-only canonical closeout truth
    - verify remote CI on the documentation closeout HEAD
    - integrate PR #87 into main when exact-head gates remain green
  forbidden:
    - no further ALUNOS product changes in this tranche
    - no new module
    - no unrelated refactor
    - no historical migration modification
    - no parallel writer
    - no automatic scope expansion
    - no Finance or unrelated module work
    - no broad UI redesign
    - no CI or workflow weakening
    - no new PR or branch
    - no force push
    - destructive Git reconciliation without explicit authorization

protected_invariants:
  - browser never owns institution, Person, role, decision or case authority
  - decisionRef remains opaque and non-authoritative by itself
  - tenant boundaries fail closed and remain non-disclosing
  - activation remains Administration/Direcao server authority
  - activation remains transactional and idempotent
  - historical applied migrations remain immutable
  - Single Process Truth and Journey Rail remain canonical product model
  - exactly one active StudentProfile invariant remains intact
  - no duplicate Person, StudentProfile or Enrollment creation
  - document validation cannot be weakened
  - no hidden manual database dependency

gates:
  final_product_checkpoint: aa5dc956d82e6ad941377f75f6144a642c64f6a6
