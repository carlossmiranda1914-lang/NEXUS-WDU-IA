name: S02 Final Registration Gate

on:
  push:
    branches:
      - feature/secretariat-s02-final-complete

permissions:
  contents: read

jobs:
  registration-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus_test
      TEST_DATABASE_CONFIRMATION: NEXUS_TEST_DATABASE
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx tests/secretariat-s02-final-registration-policy.test.ts
      - run: npx tsx tests/secretariat-s02-final-registration-contract.test.ts
      - run: npx tsx tests/secretariat-s02-final-registration-postgres.test.ts
      - run: npm run test:migrations:isolated
      - run: npm run lint
      - run: npm run build
