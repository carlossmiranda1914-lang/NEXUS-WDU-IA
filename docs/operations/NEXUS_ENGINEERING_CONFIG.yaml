protected_invariants:
  - Tasks 1 through 5 accepted behavior remains intact
  - Task 5 is the single canonical idempotency and command-result authority
  - reversal is an append-only confirmed Journal fact and never mutates the original
  - reversal references the original through reverses_transaction_id
  - original and reversal are same institution and currency
  - reversal amount is strictly positive and never exceeds remaining reversible amount
  - remaining reversible equals original amount minus exact sum of confirmed reversals
  - original-row SELECT FOR UPDATE is the database concurrency arbiter for over-reversal
  - no process-local lock is correctness authority
  - canonical reversal fingerprint excludes idempotency key and includes material approved semantics
  - Journal entries audit command-result and outbox remain atomic
  - Task 6 does not implement recovery projection outbox consumer or upper Finance domains

