    - IMPLEMENTATION_PLAN
    - EXECUTION
    - INDEPENDENT_REVIEW
    - ADVERSARIAL_PRODUCT_REVIEW
    - HUMAN_UAT
    - INTEGRATION
    - PROJECT_STATE_UPDATE

scope:
  authorized:
    - FINANCE-FOUNDATION-01 Task 1 only
    - exact decimal monetary primitives
    - controlled currency registry foundation fixture
    - typed decimal ratio percentage and directional exchange rate
    - explicit quantization and deterministic remainder distribution
    - finance money model behavior tests
    - execution record updates
  forbidden:
    - Task 2 or later Finance Foundation work
    - Finance PostgreSQL migrations
    - Journal repository or Finance command implementation
    - Financial Profile persistence
    - Payment Allocation Reconciliation provider fiscal reporting or Finance UI
    - legacy Finance data mutation
    - server route changes
    - runtime business DDL
    - unrelated refactor
    - historical migration modification
    - parallel writer
    - automatic scope expansion
    - CI or workflow weakening
    - force push

protected_invariants:
  - merged main remains integrated capability authority until Finance is merged
  - browser never owns institution Person role or financial authority
  - tenant boundaries fail closed and remain non-disclosing
  - historical applied migrations remain immutable
  - authoritative Money never uses binary floating point
  - Money identity is normalized exact decimal plus canonical currency
  - cross currency arithmetic has no implicit FX
  - negative zero canonicalizes to zero
  - Task 1 does not create Journal Payment Allocation Reconciliation or provider authority

