name: Secretariat Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secretariat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_ci_runner
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_ci_fnd06
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_ci_runner -d nexus_ci_fnd06"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://nexus_ci_runner:postgres@127.0.0.1:5432/nexus_ci_fnd06
      TEST_DATABASE_CONFIRMATION: NEXUS_TEST_DATABASE
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical quality gate
        env:
          QUALITY_GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run quality-gate

      - name: Nexus preflight
        run: npm run nexus:preflight

      - name: Prepare test database
        run: npm run test:database:setup

      - name: Secretariat S03 process gates
        run: npm run test:secretariat-s03

      - name: Academic-year temporal closure
        run: |
          npx tsx tests/academic-year-policy.test.ts
          npx tsx tests/academic-year-api-contract.test.ts
          npx tsx tests/academic-year-postgres-lifecycle.test.ts
          npx tsx tests/enrollment-temporal-context.test.ts
          npx tsx tests/enrollment-temporal-context-postgres.test.ts
          npx tsx tests/enrollment-history-postgres.test.ts
          npm run test:s02:schema-regression

      - name: S02.1 intake intent regression
        run: |
          npx tsx tests/secretariat-s02-1-intake-intent.test.ts
          npx tsx tests/enrollment-intake-api-contract.test.ts

      - name: S02.2 lifecycle regression
        run: |
          npx tsx tests/secretariat-s02-2-lifecycle-actions.test.ts
          npx tsx tests/enrollment-policy.test.ts

      - name: S02.3.2 requirement policy
        run: npx tsx tests/secretariat-s02-3-2-requirement-policy.test.ts

      - name: S02.3.2 integration contracts
        run: |
          npx tsx tests/secretariat-s02-3-2-integration-contract.test.ts
          npx tsx tests/secretariat-s02-3-2-api-fields-contract.test.ts
          npx tsx tests/secretariat-s02-3-2-final-integration.test.ts

      - name: S02.3.2 PostgreSQL versioning
        run: npx tsx tests/secretariat-s02-3-2-postgres.test.ts

      - name: S02.3.1 document regression
        run: |
          npx tsx tests/secretariat-s02-3-document-policy.test.ts
          npx tsx tests/secretariat-s02-3-document-service-contract.test.ts
          npx tsx tests/secretariat-s02-3-document-http-contract.test.ts
          npx tsx tests/secretariat-s02-3-document-postgres.test.ts

      - name: Intake PostgreSQL regression
        run: npx tsx tests/enrollment-intake-api-postgres.test.ts

      - name: S01 full regression
        run: |
          npx tsx tests/secretariat-s01-visual-contract.test.ts
          npx tsx tests/secretariat-s01-1-responsive-interaction.test.ts
          npx tsx tests/secretariat-s01-2-flow-simplification.test.ts
          npx tsx tests/secretariat-s01-final-closure.test.ts
          npx tsx tests/enrollment-operations-model.test.ts
          npx tsx tests/enrollment-operations-ui-contract.test.ts

      - name: Isolated migrations
        run: npm run test:migrations:isolated

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build
