version: 1
status: CANONICAL_OPERATIONAL_SELECTOR

project:
  name: Nexus Edu IA
  repository: carlossmiranda1914-lang/NEXUS-WDU-IA
  integrated_baseline:
    branch: main
    sha: f945fe43d72e9f86078a184d557691e1c32d4b63

active_work:
  program: ALUNOS
  mission: ALUNOS-01A.3
  mission_branch: codex/alunos-01a-design
  durable_remote_checkpoint: 068dbcbd8b43eca8ae37ef96d6e008185fb67bd7
  activity: FINAL_HARDENING/CLOSEOUT
  task: ALUNOS-FINAL-HARDENING
  task_name: Final Continuity and Integrity Hardening
  state: IMPLEMENTING
  owner: Codex
  write_owner: CODEX
  reviewer: ANTIGRAVITY
  reviewer_mode: READ_ONLY
  risk: HIGH
  resume_rule: >-
    Execute only the bounded ALUNOS-01A.3 final hardening against the four
    accepted product risk classes F2-F5, starting from checkpoint
    068dbcbd8b43eca8ae37ef96d6e008185fb67bd7. Use RED -> root cause ->
    minimal correction -> GREEN for each class, then independently review the
    exact resulting HEAD before review-thread resolution, UAT or integration.

execution:
  one_code_owner_per_unit: true
  reviewer_starts_read_only: true
  parallelism: INDEPENDENT_WORK_OR_FROZEN_CONTRACT_ONLY
  self_approval_of_integration: false
  implementation_pipeline:
    - DISCOVERY
    - PRODUCT_DECISION
    - DESIGN_AUTHORITY
    - MISSION_PACK
    - IMPLEMENTATION_PLAN
    - EXECUTION
    - INDEPENDENT_REVIEW
    - ADVERSARIAL_PRODUCT_REVIEW
    - HUMAN_UAT
    - INTEGRATION
    - PROJECT_STATE_UPDATE

scope:
  authorized:
    - F2 state continuity: registration save -> refreshed versions -> same-drawer activation
    - F3 lifecycle continuity: activation -> active -> reachable Student Record handoff
    - F4 document policy continuity: supported ad-hoc document -> canonical policy capture/materialization
    - F5 identity contract continuity: canonical resolver match reasons -> identity review queue
    - focused regression tests required to prove F2-F5 with behavioral, PostgreSQL, HTTP, tenant and idempotency evidence
    - final closeout truth updates to PROJECT_STATE, Mission Pack and this selector after independent review
  forbidden:
    - no new module
    - no unrelated refactor
    - no historical migration modification
    - no parallel writer
    - no automatic scope expansion
    - no Finance or unrelated module work
    - no broad UI redesign
    - no CI or workflow weakening
    - no new PR or branch
    - no force push
    - destructive Git reconciliation without explicit authorization

protected_invariants:
  - browser never owns institution, Person, role, decision or case authority
  - decisionRef remains opaque and non-authoritative by itself
  - tenant boundaries fail closed and remain non-disclosing
  - activation remains Administration/Direcao server authority
  - activation remains transactional and idempotent
  - historical applied migrations remain immutable
  - Single Process Truth and Journey Rail remain canonical product model
  - exactly one active StudentProfile invariant remains intact
  - no duplicate Person, StudentProfile or Enrollment creation
  - document validation cannot be weakened
  - no hidden manual database dependency

gates:
  task_green_requires:
    - focused RED_GREEN behavioral proof for each affected risk class
    - directly affected regressions
    - PostgreSQL proof where persistence is involved
    - HTTP/tenant/security proof where authority is involved
    - idempotency/concurrency proof where invalidated by the delta
    - migration-isolation integrity proof
    - independent review of the exact resulting HEAD
  mission_product_exit_requires:
    engineering_green: true
    integrity_green: true
    product_green: true
    adversarial_review: PASS
    human_uat_green: true
    unresolved_p0: 0
    unresolved_p1: 0
    review_threads_adjudicated: true
  done_requires:
    - all accepted F2-F5 root causes closed
    - same-class variants audited
    - applicable gates satisfied
    - current-head independent review
    - affected Human UAT rerun where invalidated
    - remote CI PASS
    - integration evidence
    - canonical project state updated

resource_policy:
  mode: EFFICIENT_WITHOUT_RIGOR_LOSS
  progressive_context:
    - L0_PROJECT_STATE_AND_CONFIG
    - L1_ACTIVE_MISSION_TASK
    - L2_DIRECTLY_AFFECTED_FILES
    - L3_REQUIRED_CONTRACTS_DEPENDENCIES
    - L4_HISTORICAL_EVIDENCE
    - L5_BROAD_REPOSITORY_INVESTIGATION
  evidence_classes:
    - FRESH
    - REUSABLE
    - INVALIDATED
  test_cost_ladder:
    - TARGETED_RED_GREEN
    - AFFECTED_TESTS
    - AFFECTED_REGRESSIONS
    - CHECKPOINT_GATE
    - AGGREGATE_FINAL_GATE
  max_default_parallel_implementers_same_authority: 1
  avoid_duplicate_investigation: true
  siu_optional: true
  never_trade_for_savings:
    - TDD
    - security
    - tenant_isolation
    - data_integrity
    - independent_review
    - adversarial_review
    - required_quality_gates

handoff:
  required_fields:
    - MISSION
    - TASK
    - OWNER
    - REVIEWER
    - BASE_SHA
    - HEAD_SHA
    - BRANCH
    - IMPLEMENTED
    - AUTHORITY_CHANGED
    - SCHEMA_CHANGED
    - TESTS
    - KNOWN_LIMITATIONS
    - REVIEW_TARGET
    - CANONICAL_DOCS

integration:
  technical_task_checkpoint: IMPLEMENTATION_PLUS_INDEPENDENT_REVIEW
  mission_to_main: AGGREGATE_GATES_PLUS_ADVERSARIAL_REVIEW_PLUS_HUMAN_UAT_PLUS_PR_REVIEW
  dirty_worktree_allowed: false

recovery:
  minimum_checkpoint:
    - mission
    - official_state
    - branch
    - base_sha
    - head_sha
    - completed_evidence
    - blocker_or_next_action
