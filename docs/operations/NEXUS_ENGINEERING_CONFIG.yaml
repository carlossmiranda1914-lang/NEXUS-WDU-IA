protected_invariants:
  - merged main remains integrated capability authority until Finance is merged
  - institution identity for Finance comes only from resolved server InstitutionalContext
  - tenant boundaries fail closed and remain non-disclosing
  - historical applied migrations remain immutable
  - accepted Task 3 physical exactness is NUMERIC plus explicit scale and magnitude checks
  - do not revert Finance money or rate columns to fixed-scale typmods that silently round excess scale
  - authoritative Finance money or rates never use REAL FLOAT DOUBLE PRECISION or JavaScript number
  - confirmed Journal facts are append-only economic authority
  - prepared state has zero canonical financial effect
  - confirmation commits transaction entries audit and mandatory outbox atomically
  - economic correction is append-only not UPDATE DELETE of confirmed facts
  - Task 4 does not implement Task 5 idempotency retry semantics or upper Finance domains

