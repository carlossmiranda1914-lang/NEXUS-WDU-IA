    - DESIGN_AUTHORITY
    - MISSION_PACK
    - IMPLEMENTATION_PLAN
    - EXECUTION
    - INDEPENDENT_REVIEW
    - ADVERSARIAL_PRODUCT_REVIEW
    - HUMAN_UAT
    - INTEGRATION
