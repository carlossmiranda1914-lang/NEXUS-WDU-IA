protected_invariants:
  - Tasks 1 through 4 accepted behavior remains intact
  - exact Money persistence remains NUMERIC plus explicit scale and magnitude checks
  - canonical command identity is institution plus operation namespace plus idempotency key
  - canonical fingerprint is deterministic SHA-256 over server-canonical semantic input
  - database uniqueness is final concurrency arbiter
  - same identity and same fingerprint replays one persisted result and never duplicates economic fact
  - same identity and different fingerprint conflicts and never duplicates economic fact
  - distinct idempotency keys remain legitimate distinct commands
  - lost response recovers persisted result without recreating Journal authority
  - exactly one command-result authority exists after Task 5 integration
  - Journal transaction entries audit command-result and outbox remain atomic
  - Task 5 does not implement reversal behavior or upper Finance domains

