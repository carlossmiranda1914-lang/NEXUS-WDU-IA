protected_invariants:
  - Tasks 1 through 6 accepted behavior remains intact
  - Journal remains canonical economic truth and projection remains rebuildable read authority
  - prepared or non-confirmed data contributes zero to projection
  - projection arithmetic uses exact Money and keeps currencies separate
  - projection rebuild depends only on persisted historical authority not current policy FX browser or legacy balance
  - mandatory outbox intent remains atomic with the Journal fact
  - active outbox claim is a durable time-bounded PostgreSQL lease
  - unexpired leased rows are not claimable and expired leases are recoverable
  - attempts and last_error_code preserve durable failure retry state
  - completion is idempotent and completed rows are never reclaimed
  - consumer correctness cannot depend on process-local memory
  - Task 7 does not implement provider delivery or upper Finance domains

